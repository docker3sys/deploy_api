<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Психометрический тест</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #020617;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 760px;
      margin: auto;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px;
    }
    h1, h2 {
      text-align: center;
    }
    .question {
      margin: 20px 0;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    label {
      display: block;
      margin: 6px 0;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      font-size: 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .result {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #1e293b;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🧠 Психометрический тест</h1>
  <p style="text-align:center">Тревога • Депрессия • ОКР</p>

  <form id="testForm"></form>

  <div id="result" class="result" style="display:none"></div>
</div>

<script>
'use strict';

/* ===========================
   ДАННЫЕ ТЕСТА (РЕДАКТИРУЕМ ТУТ)
   =========================== */

const TEST = [
  {
    scale: "anxiety",
    title: "😟 Тревога",
    questions: [
      "Я часто чувствую внутреннее напряжение",
      "Мне сложно расслабиться",
    ]
  },
  {
    scale: "depression",
    title: "😔 Депрессия",
    questions: [
      "Мне трудно получать удовольствие",
      "Я чувствую усталость без причины",
    ]
  },
  {
    scale: "ocd",
    title: "🔁 ОКР",
    questions: [
      "Меня беспокоят навязчивые мысли",
      "Я совершаю повторяющиеся действия",
    ]
  }
];

const ANSWERS = [
  { text: "Нет", value: 0 },
  { text: "Иногда", value: 1 },
  { text: "Часто", value: 2 },
  { text: "Почти всегда", value: 3 },
];

/* ===========================
   РЕНДЕР ТЕСТА
   =========================== */

const form = document.getElementById("testForm");
const resultBox = document.getElementById("result");

function renderTest() {
  TEST.forEach(section => {
    const h2 = document.createElement("h2");
    h2.textContent = section.title;
    form.appendChild(h2);

    section.questions.forEach((q, i) => {
      const qId = `${section.scale}_${i}`;

      const div = document.createElement("div");
      div.className = "question";

      const p = document.createElement("p");
      p.textContent = q;
      div.appendChild(p);

      ANSWERS.forEach(a => {
        const label = document.createElement("label");
        label.innerHTML = `
          <input type="radio" name="${qId}" value="${a.value}" required>
          ${a.text}
        `;
        div.appendChild(label);
      });

      form.appendChild(div);
    });
  });

  const btn = document.createElement("button");
  btn.textContent = "📊 Показать результат";
  btn.type = "submit";
  form.appendChild(btn);
}

renderTest();

/* ===========================
   ПОДСЧЁТ РЕЗУЛЬТАТА
   =========================== */

form.addEventListener("submit", e => {
  e.preventDefault();

  const scores = {
    anxiety: 0,
    depression: 0,
    ocd: 0
  };

  const data = new FormData(form);

  for (const [key, value] of data.entries()) {
    const scale = key.split("_")[0];
    scores[scale] += Number(value);
  }

  resultBox.style.display = "block";
  resultBox.innerHTML = `
    <h2>📈 Результаты</h2>
    😟 Тревога: <b>${scores.anxiety}</b><br>
    😔 Депрессия: <b>${scores.depression}</b><br>
    🔁 ОКР: <b>${scores.ocd}</b><br><br>
    Чем выше балл — тем сильнее выражены симптомы.
  `;
});
</script>

</body>
</html>
